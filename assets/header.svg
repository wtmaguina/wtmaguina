    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <path d="M0 35H1200 M0 265H1200" stroke="#fff" opacity=".12"/>
  <path d="M45 0V300 M1155 0V300" stroke="#fff" opacity=".12"/>

